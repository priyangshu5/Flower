<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PriyangshuX8</title>
<meta name="description" content="PriyangshuX8 – an independent developer building AI agents, apps and tools. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2;--bg:#000;--ink:#151510;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000}}
:root[data-theme=dark]{--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 62%,#0d1410 0,#000 70%)}
#valley canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:var(--ink);transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:var(--ink)}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u) + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u));min-width:24px;min-height:24px}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{left:20px;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));justify-content:center;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true"><canvas id="cv"></canvas></div>
<div class="vig" aria-hidden="true"></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="PriyangshuX8">PriyangshuX8</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in curiosity.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See my work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>
<script>
(function(){
var cv=document.getElementById('cv'),x=cv.getContext('2d'),W,H,dpr,F;
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);F=Math.max(W,H*1.2)*.9}
addEventListener('resize',size);size();

// glow sprites: orange, violet, pink, yellow, ice-blue, leaf green
var hues=[[255,140,40],[190,110,255],[255,90,170],[255,225,90],[120,190,255],[40,120,70]];
var spr=hues.map(function(c){var s=document.createElement('canvas');s.width=s.height=64;var g=s.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,'rgba('+c+',.95)');r.addColorStop(.5,'rgba('+c+',.28)');r.addColorStop(1,'rgba('+c+',0)');g.fillStyle=r;g.fillRect(0,0,64,64);return s});

var D=2600,N=W<700?1400:2600,items=[],R=Math.random;
for(var i=0;i<N;i++){var leaf=R()<.38,side=R()<.5?-1:1;
 items.push({x:side*(70+Math.pow(R(),1.6)*1100),z:R()*D,h:R(),s:leaf?5:Math.floor(R()*5),leaf:leaf,ph:R()*6.28,
  rx:R()*2-1,ry:R()*2-1,sz:leaf?14:8+R()*10})}
var dust=[];for(i=0;i<220;i++)dust.push({x:R()*2-1,y:R()*2-1,z:R()*D,s:R()});

var camZ=0,vel=0,dd=0,hover=false,mx=-999,my=-999,tx=0,ty=0,last=performance.now(),started=false;
function terr(X,Z){return Math.sin(X*.004+Z*.0008)*34+Math.cos(Z*.003)*26-Math.abs(X)*.045}
function sm(a,b,v){v=Math.min(1,Math.max(0,(v-a)/(b-a)));return v*v*(3-2*v)}

addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;tx=(e.clientX/W-.5)*2;ty=(e.clientY/H-.5)*2});
addEventListener('pointerleave',function(){mx=my=-999});
addEventListener('wheel',function(e){vel+=Math.max(-120,Math.min(120,e.deltaY))*.04},{passive:true});
var ly=null;
addEventListener('touchstart',function(e){ly=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',function(e){var y=e.touches[0].clientY;if(ly!==null)vel+=(ly-y)*.06*2;ly=y;mx=e.touches[0].clientX;my=y},{passive:true});
addEventListener('touchend',function(){ly=null;mx=my=-999});

function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 dd+=((hover?1:0)-dd)*Math.min(1,dt*2.2);
 vel*=Math.pow(.04,dt);
 var idle=reduce?0:42;
 var spd=(idle+vel*60)*(1-dd*.97);
 camZ+=spd*dt;
 var camX=Math.sin(camZ*.0016)*170+tx*40, camY=88+Math.sin(camZ*.0011)*22-ty*10;
 var cx=W/2-tx*14, cy=H*.5+ty*10;
 x.globalCompositeOperation='source-over';
 x.fillStyle='rgba(0,0,0,.34)';x.fillRect(0,0,W,H);
 x.globalCompositeOperation='lighter';
 for(var i=0;i<items.length;i++){var it=items[i],z=((it.z-camZ)%D+D)%D+30;
  var fog=Math.pow(1-z/D,1.4);if(fog<.02)continue;
  var bloom=it.leaf?sm(2100,500,z):sm(1300,120,z);
  var wx=it.x+Math.sin(it.ph+camZ*.004)*6, wy=terr(it.x,it.z)+(it.leaf?4+it.h*14:12+it.h*46);
  var sx=cx+(wx-camX)/z*F, sy=cy-(wy-camY)/z*F;
  var r=it.sz/z*F*(.15+.85*bloom)*(1+dd*.5);
  var a=fog*(it.leaf?.38:.9)*(.35+.65*bloom);
  if(dd>.01){var e=dd*dd*(3-2*dd);sx+=it.rx*e*(180+z*.1);sy+=it.ry*e*160-e*40+Math.sin(now*.0008+it.ph)*8*e;if(!it.leaf)a*=1+e*.4}
  if(mx>-900){var dx=sx-mx,dy=sy-my,d=Math.sqrt(dx*dx+dy*dy);if(d<170){var p=1-d/170;sx+=dx/(d||1)*p*p*70;sy+=dy/(d||1)*p*p*70;if(!it.leaf){r*=1+p*.9;a=Math.min(1,a*(1+p*1.2))}}}
  if(sx<-40||sx>W+40||sy<-40||sy>H+40||r<.4)continue;
  var rr=Math.max(r*(it.leaf?2:3.2),1.2);
  x.globalAlpha=Math.min(1,a);x.drawImage(spr[it.s],sx-rr,sy-rr,rr*2,rr*2)}
 x.globalAlpha=1;
 for(i=0;i<dust.length;i++){var du=dust[i],z2=((du.z-camZ*1.2)%D+D)%D+30;
  var ex=dd*dd*(du.x*260);var sx2=cx+du.x*500/z2*F*.5+ex,sy2=cy+du.y*260/z2*F*.5-dd*30;
  x.globalAlpha=(1-z2/D)*.35*(.5+du.s);x.fillStyle='#f5efe2';x.fillRect(sx2,sy2,1.4,1.4)}
 x.globalAlpha=1;
 if(!started){started=true;document.getElementById('loader').classList.add('gone');
  setTimeout(function(){document.getElementById('ui').classList.add('on')},900)}
 if(!reduce||!window._once){window._once=1;requestAnimationFrame(frame)}
}
requestAnimationFrame(frame);

// hover transition on arrow
var go=document.getElementById('go');
function hv(v){hover=v;if(lp)lp.frequency.setTargetAtTime(v?420:2800,ac.currentTime,.4)}
go.addEventListener('pointerenter',function(){hv(true)});
go.addEventListener('pointerleave',function(){hv(false)});
go.addEventListener('focus',function(){hv(true)});go.addEventListener('blur',function(){hv(false)});

// ambient sound (generated, starts muted)
var ac,lp,mg,on=false,snd=document.getElementById('sound');
function build(){
 ac=new (window.AudioContext||window.webkitAudioContext)();
 lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
 mg=ac.createGain();mg.gain.value=0;lp.connect(mg);mg.connect(ac.destination);
 [[110,.07],[164.8,.05],[220,.04],[277.2,.03],[329.6,.02]].forEach(function(n,i){
  var o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
  o.type='sine';o.frequency.value=n[0];g.gain.value=n[1];
  l.frequency.value=.05+i*.03;lg.gain.value=n[1]*.6;l.connect(lg);lg.connect(g.gain);
  o.connect(g);g.connect(lp);o.start();l.start()})}
snd.onclick=function(){
 try{if(!ac)build();ac.resume();on=!on;
  mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setTargetAtTime(on?.6:0,ac.currentTime,.5);
  snd.setAttribute('aria-pressed',String(on))}catch(e){}};
})();
</script>
</body>
</html>
